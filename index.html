<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fluid Mechanics — Interactive Simulators</title>
<style>
  :root{
    --bg:#0c1418; --bg2:#0f1d23; --panel:#122930; --ink:#e7f1ef;
    --muted:#7fa3a0; --line:#1f3b42; --fluid:#41d6c3; --fluid-dim:#1c6b66;
    --vec:#ffb74d; --shear:#c792ea; --grav:#ff6b6b;
    --font:"Calibri","Segoe UI","Meiryo",メイリオ,"Hiragino Kaku Gothic ProN","ヒラギノ角ゴ ProN","Yu Gothic UI","Microsoft YaHei",sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:radial-gradient(1200px 600px at 78% -10%, #14323a 0%, transparent 60%), var(--bg);
    color:var(--ink); font-family:var(--font); font-size:17px;
    -webkit-font-smoothing:antialiased; min-height:100vh; padding:36px 20px 64px;
  }
  .wrap{max-width:1000px;margin:0 auto}
  header{position:relative;margin-bottom:34px}
  .kicker{font-size:14px;letter-spacing:.28em;text-transform:uppercase;color:var(--muted);
    display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .kicker::before{content:"";width:30px;height:1px;background:var(--fluid);display:inline-block}
  h1{font-weight:700;font-size:clamp(32px,5vw,52px);line-height:1.08;margin:0;letter-spacing:-.01em}
  h1 em{color:var(--fluid);font-style:normal}
  .sub{color:var(--muted);font-size:18px;margin-top:16px;line-height:1.75}

  .langsw{position:absolute;top:0;right:0;display:inline-flex;border:1px solid var(--line);
    border-radius:999px;overflow:hidden;background:#0b181c}
  .langsw button{font-family:inherit;font-size:14px;color:var(--muted);background:transparent;
    border:none;padding:8px 15px;cursor:pointer;transition:.15s}
  .langsw button:hover{color:var(--ink)}
  .langsw button.active{background:var(--fluid);color:#06231f;font-weight:700}
  .langsw button + button{border-left:1px solid var(--line)}
  @media(max-width:560px){.langsw{position:static;margin-bottom:18px}}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px}

  .card{position:relative;display:flex;flex-direction:column;gap:14px;text-decoration:none;color:inherit;
    background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--accent,var(--fluid));
    border-radius:14px;padding:22px 22px 20px;transition:transform .16s, border-color .16s, box-shadow .16s;
    box-shadow:0 18px 50px -34px #000;overflow:hidden}
  a.card:hover{transform:translateY(-4px);box-shadow:0 26px 60px -30px #000}
  a.card:hover .go{gap:12px;color:var(--ink)}
  .card .icon{width:64px;height:48px}
  .card h2{margin:0;font-size:22px;font-weight:700;letter-spacing:.01em}
  .card p{margin:0;color:var(--muted);font-size:15px;line-height:1.6}
  .card .go{display:inline-flex;align-items:center;gap:8px;margin-top:auto;font-size:15px;
    font-weight:700;color:var(--fluid);transition:.16s}
  .card.soon{cursor:default;opacity:.6;border-left-color:var(--line)}
  .card.soon:hover{transform:none;box-shadow:0 18px 50px -34px #000}
  .badge{position:absolute;top:16px;right:16px;font-size:12px;letter-spacing:.06em;
    border:1px solid var(--line);border-radius:999px;padding:3px 11px;color:var(--muted);background:#0b181c}

  .foot{margin-top:30px;font-size:14px;color:var(--muted);line-height:1.7}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="langsw" role="group" aria-label="Language">
      <button data-lang="en" class="active">English</button>
      <button data-lang="zh">中文</button>
      <button data-lang="ja">日本語</button>
    </div>
    <div class="kicker" id="kicker">Fluid Mechanics · Interactive</div>
    <h1 id="title">Fluid Mechanics <em>Simulators</em></h1>
    <p class="sub" id="sub">Pick a topic to explore. Each simulator runs entirely in your browser — change the parameters and feel the physics.</p>
  </header>

  <div class="grid" id="grid"></div>

  <p class="foot" id="foot">To add a new simulator, drop in an HTML file and add one entry to the <code>SIMS</code> array in the code.</p>
</div>

<script>
(function(){
  // アイコン（インラインSVG）
  const ICONS={
    slope:'<svg class="icon" viewBox="0 0 64 48"><line x1="4" y1="40" x2="60" y2="14" stroke="#7fa3a0" stroke-width="3"/><g stroke="#ffb74d" stroke-width="2.4" stroke-linecap="round"><line x1="16" y1="33" x2="30" y2="27"/><line x1="22" y1="29" x2="34" y2="24"/><line x1="30" y1="24" x2="40" y2="20"/></g><line x1="20" y1="36" x2="20" y2="29" stroke="#41d6c3" stroke-width="2"/></svg>',
    pipe:'<svg class="icon" viewBox="0 0 64 48"><rect x="6" y="14" width="52" height="20" rx="3" fill="none" stroke="#7fa3a0" stroke-width="3"/><path d="M10 24 Q32 8 54 24" fill="none" stroke="#ffb74d" stroke-width="2.4"/><g stroke="#41d6c3" stroke-width="2" stroke-linecap="round"><line x1="18" y1="24" x2="27" y2="24"/><line x1="32" y1="24" x2="44" y2="24"/></g></svg>',
    vortex:'<svg class="icon" viewBox="0 0 64 48"><circle cx="22" cy="24" r="9" fill="none" stroke="#7fa3a0" stroke-width="3"/><path d="M33 18 q9 6 0 12 M40 14 q14 10 0 20" fill="none" stroke="#c792ea" stroke-width="2.4"/><g stroke="#41d6c3" stroke-width="2" stroke-linecap="round"><line x1="2" y1="18" x2="11" y2="18"/><line x1="2" y1="30" x2="11" y2="30"/></g></svg>',
    bernoulli:'<svg class="icon" viewBox="0 0 64 48"><path d="M4 12 H26 Q34 12 38 22 Q42 32 60 32 M4 36 H26 Q34 36 38 26 Q42 16 60 16" fill="none" stroke="#7fa3a0" stroke-width="3"/><g stroke="#41d6c3" stroke-width="2" stroke-linecap="round"><line x1="10" y1="24" x2="19" y2="24"/></g><g stroke="#ffb74d" stroke-width="2.4" stroke-linecap="round"><line x1="44" y1="24" x2="57" y2="24"/><polyline points="52,20 57,24 52,28" fill="none"/></g></svg>'
  };

  // ▼ シミュレーター一覧（ここに項目を足すだけで画面に並びます）
  const SIMS=[
    { href:"viscous-film-flow-4.html", color:"var(--fluid)", icon:"slope",
      t:{ ja:{title:"斜面を流れる粘性流体", desc:"重力で斜面を流れる液膜の速度分布とせん断応力を可視化。厚み・角度・粘性を変えられます。"},
          en:{title:"Viscous Film Flow on a Slope", desc:"Velocity profile and shear stress of a film flowing down a slope. Adjust thickness, angle and viscosity."},
          zh:{title:"斜面上的黏性流体", desc:"重力作用下沿斜面流动液膜的速度分布与剪应力。可调节厚度、角度与黏度。"} } },
    { href:"bernoulli-4.html", color:"var(--fluid)", icon:"bernoulli",
      t:{ en:{title:"Bernoulli's Principle", desc:"Relating velocity, height, and pressure of a flow."},
          ja:{title:"ベルヌーイの定理", desc:"流れの速度・高さ・圧力の関係を可視化。流路の太さを変えて、速いところほど圧力が下がる様子を確かめられます。"},
          zh:{title:"伯努利定律", desc:"可视化流动的速度、高度与压力之间的关系。改变流道粗细，观察流速越快处压力越低的现象。"} } },     
    { href:"https://michinaoh.github.io/fluid-simulation/flow_lines_simulator.html", color:"var(--shear)", icon:"vortex",
      t:{ ja:{title:"流線シミュレーター", desc:"流れ場の流線（流れの道筋）を可視化。流速や障害物の配置を変えてパターンの変化を観察できます。"},
          en:{title:"Flow Line Simulator", desc:"Visualize streamlines of a flow field. Change the velocity and obstacle layout to observe how the patterns evolve."},
          zh:{title:"流线模拟器", desc:"可视化流场的流线（流动路径）。改变流速与障碍物布置，观察流型的变化。"} } },
    { soon:true, color:"var(--vec)", icon:"pipe",
      t:{ ja:{title:"管内のポアズイユ流れ", desc:"円管内の層流。圧力差による放物線速度分布。"},
          en:{title:"Poiseuille Flow in a Pipe", desc:"Laminar flow in a circular pipe; parabolic profile from a pressure gradient."},
          zh:{title:"圆管中的泊肃叶流动", desc:"圆管内层流，由压差形成的抛物线速度分布。"} } },
    { soon:true, color:"var(--shear)", icon:"vortex",
      t:{ ja:{title:"円柱まわりの流れ", desc:"レイノルズ数に応じた後流とカルマン渦。"},
          en:{title:"Flow Past a Cylinder", desc:"Wake and Kármán vortex street as a function of Reynolds number."},
          zh:{title:"绕圆柱的流动", desc:"随雷诺数变化的尾流与卡门涡街。"} } }
  ];

  const UI={
    ja:{ docTitle:"流体力学 インタラクティブ・シミュレーター", kicker:"Fluid Mechanics · Interactive",
         title:'流体力学 <em>シミュレーター</em>',
         sub:"学びたいテーマを選んでください。各シミュレーターはブラウザだけで動き、パラメータを変えながら物理を体感できます。",
         open:"開く", soon:"準備中",
         foot:'新しいシミュレーターは、HTML ファイルを追加して、コード内の <code>SIMS</code> 配列に1項目足すだけでこの画面に並びます。' },
    en:{ docTitle:"Fluid Mechanics — Interactive Simulators", kicker:"Fluid Mechanics · Interactive",
         title:'Fluid Mechanics <em>Simulators</em>',
         sub:"Pick a topic to explore. Each simulator runs entirely in your browser — change the parameters and feel the physics.",
         open:"Open", soon:"Coming soon",
         foot:'To add a new simulator, drop in an HTML file and add one entry to the <code>SIMS</code> array in the code.' },
    zh:{ docTitle:"流体力学 — 交互式模拟器", kicker:"流体力学 · 交互式",
         title:'流体力学 <em>模拟器</em>',
         sub:"请选择想要学习的主题。每个模拟器都在浏览器中运行——改变参数，体会物理。",
         open:"打开", soon:"敬请期待",
         foot:'要添加新的模拟器，只需放入一个 HTML 文件，并在代码中的 <code>SIMS</code> 数组里添加一项。' }
  };

  let lang="en";
  const grid=document.getElementById('grid');

  function render(){
    const u=UI[lang];
    grid.innerHTML="";
    SIMS.forEach(s=>{
      const t=s.t[lang];
      const el=document.createElement(s.soon?'div':'a');
      el.className="card"+(s.soon?" soon":"");
      el.style.setProperty('--accent', s.color);
      if(!s.soon) el.href=s.href;
      el.innerHTML =
        (ICONS[s.icon]||"") +
        '<h2>'+t.title+'</h2>' +
        '<p>'+t.desc+'</p>' +
        (s.soon
          ? '<span class="badge">'+u.soon+'</span>'
          : '<span class="go">'+u.open+' →</span>');
      grid.appendChild(el);
    });
  }

  function applyLang(l){
    lang=l; const u=UI[l];
    document.documentElement.lang = (l==='zh')?'zh-Hans':l;
    document.title=u.docTitle;
    document.getElementById('kicker').textContent=u.kicker;
    document.getElementById('title').innerHTML=u.title;
    document.getElementById('sub').textContent=u.sub;
    document.getElementById('foot').innerHTML=u.foot;
    document.querySelectorAll('.langsw button').forEach(b=>b.classList.toggle('active', b.dataset.lang===l));
    render();
  }

  document.querySelectorAll('.langsw button').forEach(b=>{
    b.addEventListener('click',()=>applyLang(b.dataset.lang));
  });
  applyLang('en');
})();
</script>
</body>
</html>
